<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; font-size: 18px; fill: #1a202c; }
      .sub-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #718096; }
      .math-var { font-family: 'Georgia', serif; font-style: italic; font-weight: bold; font-size: 22px; fill: #2d3748; }
      .math-inline { font-family: 'Georgia', serif; font-style: italic; font-size: 16px; fill: #2d3748; }
      .param-value { font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; fill: #2f855a; }
      .large-node-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: bold; font-size: 28px; fill: #2d3748; }
    </style>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#48bb78"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(60, 135)">
    <rect width="80" height="80" rx="6" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="40" y="-30" text-anchor="middle" class="title-text">Input</text>
    <text x="40" y="52" text-anchor="middle" class="large-node-text" fill="#2b6cb0">X</text>
  </g>

  <path d="M 140 180 L 260 180" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="185" y="170" text-anchor="middle" class="math-var" font-size="18px">x₁</text>

  <path d="M 140 200 L 260 280" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="185" y="220" text-anchor="middle" class="math-var" font-size="18px">x₂</text>


  <g transform="translate(270, 55)">
    <text x="40" y="-10" text-anchor="middle" class="math-var">b₁</text>
    <rect width="80" height="32" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <text x="40" y="21" text-anchor="middle" class="param-value">+ -9.0</text>
  </g>

  <g transform="translate(270, 160)">
    <text x="40" y="-10" text-anchor="middle" class="math-var">w₁</text>
    <rect width="80" height="32" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <text x="40" y="21" text-anchor="middle" class="param-value">× 6.0</text>
  </g>

  <g transform="translate(270, 265)">
    <text x="40" y="-10" text-anchor="middle" class="math-var">w₂</text>
    <rect width="80" height="32" rx="4" fill="#f0fff4" stroke="#48bb78" stroke-width="2"/>
    <text x="40" y="21" text-anchor="middle" class="param-value">× 6.0</text>
  </g>


  <path d="M 350 65 L 460 170" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 350 176 L 460 176" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 350 280 L 460 182" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>


  <g transform="translate(470, 135)">
    <rect width="90" height="90" rx="6" fill="none" stroke="#3182ce" stroke-width="3"/>
    <text x="45" y="-12" text-anchor="middle" class="title-text" fill="#3182ce">neuron</text>
    
    <line x1="10" y1="45" x2="80" y2="45" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="45" y1="10" x2="45" y2="80" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 15 75 Q 38 75 45 45 T 75 15" fill="none" stroke="#2d3748" stroke-width="3"/>
  </g>


  <g>
    <path d="M 565 180 L 730 180" fill="none" stroke="#48bb78" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="645" y="170" text-anchor="middle" class="math-var" font-size="24px" fill="#2d3748">y_pred</text>
    <text x="645" y="200" text-anchor="middle" class="math-inline" fill="#4a5568">σ(w₁x₁ + w₂x₂ + b₁)</text>
  </g>


  <g transform="translate(740, 135)">
    <rect width="80" height="80" rx="6" fill="none" stroke="#48bb78" stroke-width="3"/>
    <text x="40" y="-25" text-anchor="middle" class="title-text">Output</text>
    <text x="40" y="-8" text-anchor="middle" class="sub-text">(Prediction)</text>
    <text x="40" y="50" text-anchor="middle" class="large-node-text" fill="#2f855a">AND</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;">
  
  <!-- Definición de flechas y estilos -->
  <defs>
    <marker id="arrow-rel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e056fd"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Rejilla de fondo (Grid) ligera -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="150" x2="560" y2="150" />
    <line x1="90" y1="270" x2="560" y2="270" />
    <line x1="210" y1="90" x2="210" y2="380" />
    <line x1="440" y1="90" x2="440" y2="380" />
  </g>

  <!-- Ejes del espacio vectorial -->
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#axis-arrow)">
    <!-- Eje X -->
    <line x1="90" y1="380" x2="580" y2="380" />
    <!-- Eje Y -->
    <line x1="90" y1="380" x2="90" y2="80" />
  </g>
  
  <!-- Etiquetas de los ejes explicativas -->
  <text x="560" y="405" fill="#4b5563" font-size="12" font-weight="600" text-anchor="end">Dimensión 1: Tipo de Entidad (País ➔ Capital)</text>
  <text x="-175" y="140" fill="#4b5563" font-size="12" font-weight="600" transform="rotate(-90 25 90)">Dimensión 2: Geografía / Cultura</text>

  <!-- Agrupaciones semánticas (Líneas discontinuas de guía) -->
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4">
    <!-- Similitud de Países (Horizontal) -->
    <line x1="210" y1="270" x2="210" y2="150" />
    <!-- Similitud de Capitales (Horizontal) -->
    <line x1="440" y1="270" x2="440" y2="150" />
  </g>
  
  <!-- Etiquetas de las agrupaciones -->
  <text x="210" y="80" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">Eje de PAÍSES</text>
  <text x="440" y="80" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">Eje de CAPITALES</text>

  <!-- Vectores de Relación País -> Capital (Flechas) -->
  <!-- España -> Madrid -->
  <line x1="210" y1="270" x2="432" y2="270" stroke="#e056fd" stroke-width="2.5" marker-end="url(#arrow-rel)" />
  <!-- Francia -> París -->
  <line x1="210" y1="150" x2="432" y2="150" stroke="#e056fd" stroke-width="2.5" marker-end="url(#arrow-rel)" />


  <!-- PUNTOS Y ETIQUETAS -->

  <!-- ESPAÑA (Abajo a la izquierda) -->
  <circle cx="210" cy="270" r="6" fill="#2563eb" />
  <text x="195" y="274" fill="#1e40af" font-size="14" font-weight="bold" text-anchor="end">España</text>

  <!-- FRANCIA (Arriba a la izquierda - Cerca de España en el eje Y) -->
  <circle cx="210" cy="150" r="6" fill="#2563eb" />
  <text x="195" y="154" fill="#1e40af" font-size="14" font-weight="bold" text-anchor="end">Francia</text>

  <!-- MADRID (Abajo a la derecha - Alineado en Y con España) -->
  <circle cx="440" cy="270" r="6" fill="#16a34a" />
  <text x="455" y="274" fill="#166534" font-size="14" font-weight="bold">Madrid</text>

  <!-- PARÍS (Arriba a la derecha - Alineado en Y con Francia y en X con Madrid) -->
  <circle cx="440" cy="150" r="6" fill="#16a34a" />
  <text x="455" y="154" fill="#166534" font-size="14" font-weight="bold">París</text>

</svg>
